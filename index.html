<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>コンピュータサイエンス第一 課題解答解説</title>
<meta name="description" content="コンピュータサイエンス第一の課題解答解説(PDF)一覧">
<style>
:root{--accent:#2b6cb0;--tint:#eef3fa;--box:#f4f4f4;--line:#d4d4d4;--text:#222;--muted:#777}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--text);line-height:1.8;
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",-apple-system,sans-serif}
main{max-width:42rem;margin:0 auto;padding:3rem 1.25rem 4rem}
h1{margin:0 0 2rem;padding-bottom:.9rem;border-bottom:1px solid var(--accent);
  color:var(--accent);font-size:clamp(1.3rem,4.5vw,1.7rem);font-weight:500;line-height:1.5}
h2{margin:0 0 1rem;font-size:1.1rem;display:flex;align-items:stretch;gap:.6rem}
h2::before{content:"";width:.7rem;background:var(--accent);flex:none}
ul{list-style:none;margin:0;padding:0;display:grid;gap:.9rem}
a.item{display:block;padding:.9rem 1.1rem;color:inherit;text-decoration:none;
  background:var(--tint);border:1px solid #dbe5f2;border-left:3px solid var(--accent);border-radius:3px}
a.item:hover,a.item:focus-visible{background:#e3ecf7;outline:none}
.label{display:block;font-size:.8rem;color:var(--accent);font-weight:600}
.title{font-weight:600}
.sub{display:block;font-size:.88rem;color:var(--muted)}
.pdf{float:right;font-family:Menlo,monospace;font-size:.78rem;color:var(--accent);
  background:#fff;border:1px solid var(--line);border-radius:2px;padding:0 .4rem;margin-top:.1rem}
footer{margin-top:3rem;text-align:center;font-size:.8rem;color:var(--muted)}
</style>
</head>
<body>
<main>
  <h1>コンピュータサイエンス第一 課題解答解説</h1>
  <h2>解答解説一覧</h2>
  <ul>
    <li><a class="item" href="1st.pdf">
      <span class="pdf">PDF</span><span class="label">第一回</span>
      <span class="title">課題解答解説</span>
      <span class="sub">変数・数値と文字列・「+」演算子</span></a></li>
    <li><a class="item" href="2nd.pdf">
      <span class="pdf">PDF</span><span class="label">第二回</span>
      <span class="title">課題解答解説</span>
      <span class="sub">関数・繰り返し・条件分岐・剰余</span></a></li>
    <li><a class="item" href="3rd.pdf">
      <span class="pdf">PDF</span><span class="label">第三回</span>
      <span class="title">課題解答解説</span>
      <span class="sub">リスト・辞書・ループによる集計</span></a></li>
  </ul>
  <footer>新しい回は随時追加されます</footer>
</main>
</body>
</html>
